.start{padding:0;width:97px;border-radius:0 10px 10px 0;background:none;box-shadow:none}.start-logo{width:97px;height:31px;filter:none;object-fit:fill}.xp-logo img{width:98px;height:80px}.login-form label{font-family:Tahoma,Arial,sans-serif}.login-brand p{font-family:Tahoma,Arial,sans-serif}.window[data-app="game"]>.status,.window[data-app="setup"]>.status{display:none}.installer{font:11px/1.5 Tahoma,Arial,sans-serif;padding:24px}.installer h2{font:bold 14px Tahoma,Arial,sans-serif}.gamehint{display:none}#login{display:none!important}</style><link rel="stylesheet" href="investigation.css"><link rel="stylesheet" href="outbreak.css"></head><body><div id="desktop">

<script>
const $=s=>document.querySelector(s),desktop=$('#desktop');let cascadeTimer=null,cascadeCount=0;let z=20,profile='',sound=false,ctx,practice=false,installed=false,paused=false;const windows=new Map();const day=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Colombo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const cases=[{id:'014',title:'The last workstation',story:'At 02:14, a workstation was locked from the inside. Three files survived. One of them contradicts the operator’s story.',question:'The operator says nobody used the terminal after midnight. Which evidence most directly disproves that claim?',options:['A security scan scheduled for 01:00','A successful interactive login recorded at 02:09','A folder created the previous afternoon','A note saying the terminal was usually left on'],correct:1,explain:'The event log records a successful interactive login at 02:09. A scheduled task does not establish that a person accessed the terminal.'},{id:'015',title:'The missing attachment',story:'A message claims to be from IT. It asks you to run an urgent security update, but the attachment is named security_patch.pdf.exe.',question:'Which detail is the clearest sign that the attachment is an executable disguised as a document?',options:['The message arrived at night','The filename includes the word security','The final filename extension is .exe','The message says the update is urgent'],correct:2,explain:'The final extension is .exe, indicating an executable file rather than a PDF document.'},{id:'016',title:'A clock out of place',story:'A camera records a visitor entering at 22:10. Its clock is exactly 12 minutes slow. The door log uses the correct time.',question:'Which door-log time should match the visitor’s arrival?',options:['21:58','22:10','22:34','22:22'],correct:3,explain:'Add 12 minutes to the camera’s displayed time: 22:10 becomes 22:22.'}];
let caseIndex=Math.floor(Date.parse(day+'T00:00:00Z')/86400000)%cases.length,state={wrong:0,solved:false,chosen:[]};const current=()=>cases[caseIndex];const key=()=>`deadline:${profile}:${day}`;
function save(){if(!practice)localStorage.setItem(key(),JSON.stringify({...state,caseIndex,installed}));localStorage.setItem('deadline-user',profile)}
function beep(type='error'){if(sound){const a=new Audio('assets/'+(type==='success'?'logon-sound.wav':'critical-stop.wav'));a.volume=.15;a.play().catch(()=>{});}return; if(!sound)return;try{ctx??=new AudioContext();const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.setValueAtTime(type==='success'?660:220,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(type==='success'?880:110,ctx.currentTime+.15);g.gain.setValueAtTime(.035,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.25);o.start();o.stop(ctx.currentTime+.3)}catch{}}
function escapeHTML(v){return v.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function win(id,title,html,width=660){if(windows.has(id)){const el=windows.get(id);el.hidden=false;el.style.zIndex=++z;return el}const el=document.createElement('section');el.className='window';el.dataset.app=id;el.setAttribute('aria-label',title);el.style.width=width+'px';let n=windows.size;el.style.left=Math.min(24+n*3,45)+'%';el.style.top=Math.min(12+n*4,32)+'%';el.style.zIndex=++z;el.innerHTML=`<div class="titlebar"><img class="title-icon" src="assets/icon-3.ico" alt=""><span class="caption">${escapeHTML(title)}</span><div class="controls"><button aria-label="Minimize">_</button><button aria-label="Maximize">□</button><button class="close" aria-label="Close">×</button></div></div><div class="menubar"><button data-menu="file">File</button><button data-menu="help">Help</button></div><div class="content">${html}</div><div class="status">Ready</div>`;$('#windows').append(el);windows.set(id,el);el.onpointerdown=()=>el.style.zIndex=++z;const controls=el.querySelectorAll('.controls button');controls[0].onclick=()=>el.hidden=true;controls[1].onclick=()=>{el.classList.toggle('maxed');if(el.classList.contains('maxed')){el.dataset.old=el.style.cssText;el.style.cssText+= ';left:5px;top:5px;width:calc(100% - 10px);height:calc(100% - 45px);max-width:none;max-height:none'}else el.style.cssText=el.dataset.old};controls[2].onclick=()=>closeWin(id);el.querySelector('[data-menu=file]').onclick=e=>showWindowMenu(e,id);el.querySelector('[data-menu=help]').onclick=()=>openApp('help');let drag;el.querySelector('.titlebar').onpointerdown=e=>{if(e.target.closest('button'))return;const r=el.getBoundingClientRect();drag={x:e.clientX-r.left,y:e.clientY-r.top};e.currentTarget.setPointerCapture(e.pointerId)};el.querySelector('.titlebar').onpointermove=e=>{if(!drag)return;el.style.left=Math.max(0,Math.min(innerWidth-100,e.clientX-drag.x))+'px';el.style.top=Math.max(0,Math.min(innerHeight-80,e.clientY-drag.y))+'px'};el.querySelector('.titlebar').onpointerup=()=>drag=null;renderTasks();return el}
function closeWin(id){windows.get(id)?.remove();windows.delete(id);renderTasks()}
function renderTasks(){$('#tasks').innerHTML='';windows.forEach((el,id)=>{let b=document.createElement('button');b.className='task';b.innerHTML='<img class="task-icon" src="assets/icon-3.ico" alt="">';b.append(document.createTextNode(el.getAttribute('aria-label')));b.onclick=()=>{el.hidden=!el.hidden;if(!el.hidden)el.style.zIndex=++z};$('#tasks').append(b)})}
function toast(title,text){$('#toast').hidden=false;$('#toast').className='notice';$('#toast').innerHTML=`<button class="dismiss" aria-label="Dismiss">×</button><strong>${title}</strong><p>${text}</p>`;$('#toast').onclick=e=>{if(e.target.closest('.dismiss'))$('#toast').hidden=true;else{$('#toast').hidden=true;openApp('security')}}}
function integrity(){return state.solved?100:Math.max(0,100-state.wrong*14-(state.wrong===7?2:0))}
function effects(){syncCascade();desktop.classList.toggle('infected',installed&&!state.solved&&state.wrong>1);desktop.classList.toggle('severe',!state.solved&&state.wrong>4);$('#trayShield').innerHTML=installed&&!state.solved?'<img class="xp-icon" src="assets/icon-28.ico" alt="">':'<img class="xp-icon" src="assets/icon-48.ico" alt="">'}
function openApp(id){$('#startmenu').hidden=true;if(id==='internet'){win('internet','Microsoft Internet Explorer',`<div class="explorer-toolbar">Back &nbsp; Forward &nbsp; Stop &nbsp; Refresh &nbsp; Home</div><div class="address">Address <input value="about:blank" aria-label="Address" readonly></div><div class="evidence"><h3>The page cannot be displayed</h3><p>This computer is disconnected from the Internet.</p><p>Check the files in My Documents for recovered case evidence.</p><button class="btn" onclick="openApp('files')">Open My Documents</button></div>`,700);return}if(id==='game'){if(!installed)welcome();else game();return}if(id==='security'){security();return}if(id==='files'){win('files','My Documents',`<div class="explorer-toolbar"><button onclick="closeWin('files');openApp('computer')"><img class="xp-icon" src="assets/icon-27.ico" alt=""> Back</button> &nbsp; Search &nbsp; Folders &nbsp; Views</div><div class="address">Address <input aria-label="Folder address" readonly value="C:\\Documents and Settings\\${escapeHTML(profile)}\\My Documents"></div><div class="files"><button class="file" onclick="openApp('log')"><span class="ico"><img class="xp-icon" src="assets/icon-1.ico" alt=""></span>access.log<small>Recovered evidence</small></button><button class="file" onclick="openApp('note')"><span class="ico"><img class="xp-icon" src="assets/icon-35.ico" alt=""></span>operator.txt<small>Witness statement</small></button><button class="file" onclick="openApp('camera')"><span class="ico"><img class="xp-icon" src="assets/icon-1.ico" alt=""></span>terminal_02.bmp<small>Scene reconstruction</small></button></div><div class="status">3 objects · Fictional case evidence</div>`);return}if(id==='log'){win('log',state.wrong>3?'access.log — Read error':'access.log — Notepad',state.wrong>3&&!state.solved?`<div class="error-body"><div class="error-sign">×</div><p>The file header is damaged.<br>Evidence is unavailable until system recovery.</p></div>`:`<div class="notepad">SYSTEM EVENT LOG / TERMINAL 07\n-------------------------------\n23:48:02  Session locked\n00:00:00  Scheduled backup completed\n01:00:00  Scheduled scan started\n02:09:16  Successful interactive login\n           User: OPERATOR / Type: 2\n02:14:31  Session locked\n\nExport integrity: VERIFIED\nFictional evidence — Case 014</div>`,520);return}if(id==='note'){win('note','operator.txt — Notepad',`<div class="notepad">INTERVIEW EXTRACT / CASE 014\n\n“I locked the terminal before midnight.\nNobody used it after that.\nThe overnight jobs run automatically.”\n\n— Operator, 08:40\n\n[This is a fictional case.]</div>`,470);return}if(id==='camera'){win('camera','terminal_02.bmp — Picture Viewer',`<div class="evidence"><div style="height:210px;background:repeating-linear-gradient(0deg,#111c2788 0 2px,transparent 2px 4px),radial-gradient(ellipse,#557477,#15242e 75%);display:grid;place-items:center;color:#a9c5bb;font:14px monospace"><div style="border:8px solid #17222a;padding:22px;background:#142c36;box-shadow:0 12px #101b21">TERMINAL 07<br><br>SESSION LOCKED<br><small>02:14:31</small></div></div><p>Scene reconstruction · Terminal 07<br><small>Illustrative in-game evidence, created for this fictional case.</small></p></div>`,500);return}if(id==='computer'){win('computer','My Computer',`<div class="files"><button class="file" onclick="openApp('security')"><span class="ico"><img class="xp-icon" src="assets/icon-8.ico" alt=""></span>Local Disk (C:)<small>${integrity()}% integrity</small></button><button class="file" onclick="openApp('files')"><span class="ico"><img class="xp-icon" src="assets/folder.png" alt=""></span>Shared Documents</button><button class="file" onclick="openApp('game')"><span class="ico"><img class="xp-icon" src="assets/icon-12.ico" alt=""></span>DEADLINE (D:)</button></div>`);return}if(id==='recycle'){win('recycle','Recycle Bin',`<div class="empty">The Recycle Bin is empty.<br><br>Some things cannot be recovered here.</div>`,450);return}if(id==='help'){win('help','DEADLINE XP — Read me',`<div class="setting"><h2>One question. Seven chances.</h2><p>Open DEADLINE.exe to install the game. Inspect My Documents for evidence in Case 014, then answer in the containment console.</p><p>Wrong answers damage the simulated desktop. A correct answer restores the system. Seven mistakes trigger a staged crash.</p><p>Daily progress is stored for each name on this browser. There are three rotating sample cases, not a live question service. Visual asset sources: <a href="assets/credits.txt" target="_blank">credits</a>. Practice can be replayed.</p><p>All case evidence is fictional. Nothing is installed on your computer.</p><button class="btn" onclick="startPractice()">Start practice session</button></div>`,510);return}if(id==='run'){win('run','Run',`<div class="setting"><p>Type the name of a program, folder, or document, and Windows will open it for you.</p><form onsubmit="event.preventDefault();runCommand(this.elements.command.value)"><label>Open: <input name="command" aria-label="Open" autofocus></label><div class="footer"><button class="btn">OK</button><button type="button" class="btn" onclick="closeWin('run')">Cancel</button></div></form></div>`,400);return}if(id==='settings'){win('settings','Control Panel',`<div class="setting"><h2>System preferences</h2><label><input type="checkbox" ${sound?'checked':''} onchange="sound=this.checked;$('#audio').textContent=sound?'♫':'♪'"> Play quiet interface sounds</label><p>Operator: ${escapeHTML(profile)}<br>Profile storage: this browser only<br>Daily reset: midnight, Sri Lanka time</p><button class="btn" onclick="startPractice()">New practice session</button> <button class="btn" onclick="logout()">Log off</button></div>`,480)}}
function welcome(){win('game','DEADLINE Setup',`<div class="welcome"><aside class="side"><img src="assets/icon-12.ico" width="62" alt=""></aside><div class="main"><h2>Welcome to the DEADLINE<br>Setup Wizard</h2><p>This will install DEADLINE on your computer.</p><p>It is recommended that you close all other applications before continuing.</p><p>Click Next to continue, or Cancel to exit Setup.</p><div class="wizard-note">One question each day. Seven attempts to answer it.<br><br>All installation and system effects are part of the game.</div></div></div><div class="wizard-footer"><button class="btn" disabled>&lt; Back</button><button class="btn primary" onclick="install()">Next &gt;</button><button class="btn" onclick="closeWin('game')">Cancel</button></div>`,520)}
function install(){closeWin('game');const el=win('setup','DEADLINE XP — Installing',`<div class="installer"><h2>Installing DEADLINE XP</h2><p>Please wait while Setup installs the game on your simulated computer.</p><div class="progress"><div id="installbar"></div></div><p id="installtext">Extracting game files...</p><p class="muted">Destination: C:\\Program Files\\DEADLINE</p></div>`,530);let p=0;const t=setInterval(()=>{p+=8;const bar=el.querySelector('#installbar');if(bar)bar.style.width=Math.min(p,100)+'%';if(p>55&&el.querySelector('#installtext'))el.querySelector('#installtext').textContent='Registering system service...';if(p>=100){clearInterval(t);installed=true;save();closeWin('setup');effects();beep();toast('<img class="xp-icon" src="assets/icon-28.ico" alt=""> Security Center — Threat detected','DEADLINE.exe is attempting to modify protected system files. Click to inspect the threat.');security()}},180)}
function security(){closeWin('security');const infected=installed&&!state.solved;win('security','Windows Security Center',`<div class="scanhead"><span class="shield">${infected?'<img class="xp-icon" src="assets/icon-28.ico" alt="">':'<img class="xp-icon" src="assets/icon-48.ico" alt="">'}</span><div><h2>${infected?'Your system is at risk':'Your system is protected'}</h2><span>${infected?'An unknown process is spreading.':'No active threats detected.'}</span></div></div><div class="scanbody">${infected?`<div class="danger"><strong>Threat: Trojan.Deadline.Question</strong><br>Source: C:\\Program Files\\DEADLINE\\DEADLINE.exe<br>Automatic removal failed. Manual containment required.</div>`:'<div class="recovery">Security services are running normally.</div>'}<div class="meters"><div class="meter">System integrity<b>${integrity()}%</b><div class="health"><i style="width:${integrity()}%"></i></div></div><div class="meter">Attempts remaining<b>${7-state.wrong} / 7</b><span class="muted">${practice?'Practice session':'Daily session · '+day}</span></div></div><div class="footer"><button class="btn" onclick="openApp('files')">Inspect evidence</button><button class="btn primary" onclick="openApp('game')">${infected?'Contain threat >':installed?'Open daily case':'Open installer >'}</button></div></div>`,590)}
function game(message='',correct=false){closeWin('game');let c=current();win('game','DEADLINE.exe — Containment Console',`<div class="game-body"><div class="case-top"><span>CASE ${c.id} / ${practice?'PRACTICE':day}</span><span>${state.solved?'THREAT CONTAINED':7-state.wrong+' ATTEMPTS LEFT'}</span></div><div class="eyebrow">${c.title.toUpperCase()}</div><p style="line-height:1.7;color:#667384">${c.story}</p><p class="question">${c.question}</p>${message?`<div class="feedback ${correct?'success':''}" role="status">${message}</div>`:''}${state.solved?`<div class="feedback success"><strong>System restored. You made it.</strong><br>${c.explain}</div><div class="footer"><button class="btn" onclick="startPractice()">Practice another case</button></div>`:state.wrong>=7?'<p>System failure. Recovery is required.</p>':c.options.map((o,i)=>`<button class="answer" onclick="answer(${i})"><span>${String.fromCharCode(65+i)}</span>${o}</button>`).join('')}<div class="footer"><span class="muted">${practice?'Replayable practice':'Daily case · Progress saved locally'}</span><button class="btn" onclick="openApp('files')"><img class="xp-icon" src="assets/folder.png" alt=""> Evidence</button></div></div>`,660)}
function answer(i){if(paused||state.solved||state.wrong>=7)return;state.chosen.push(i);if(i===current().correct){state.solved=true;save();beep('success');effects();[...windows.keys()].filter(k=>k.startsWith('error')||k.startsWith('cascade')||k==='log').forEach(closeWin);game('',true);toast('<img class="xp-icon" src="assets/icon-48.ico" alt=""> Threat contained','Protected files restored. The system is safe — until tomorrow.');if(windows.has('security')){security();windows.get('security').style.zIndex=10}}else{state.wrong++;save();beep();effects();desktop.classList.remove('glitch');void desktop.offsetWidth;desktop.classList.add('glitch');game(`Incorrect. ${7-state.wrong} attempts remain. ${['','A protected process has been modified.','The desktop renderer is unstable.','Unexpected system errors detected.','Evidence file access.log is damaged.','Display driver recovery failed.','Critical services are shutting down.','System failure.'][state.wrong]}`);if(state.wrong>=7){setTimeout(crash,650);return}if(state.wrong>=2)errorPopup();toast('<img class="xp-icon" src="assets/icon-28.ico" alt=""> System integrity: '+integrity()+'%','Contain the threat before more protected files are damaged.');if(windows.has('security')){security();windows.get('security').style.zIndex=10}}}
function errorPopup(){const n=state.wrong;let el=win('error'+n,['','','Application Error','Windows — Delayed Write Failed','File System Error','Display Driver Error','Critical System Error'][n],`<div class="error-body"><span class="error-sign">×</span><p>${['','','The instruction at 0x0000DEAD referenced protected memory. The memory could not be read.','Windows was unable to save all the data for the file C:\\system\\desktop.dat.','Cannot read access.log. The file or directory is corrupted and unreadable.','The display driver has stopped responding. System recovery unsuccessful.','A critical system process has terminated unexpectedly.'][n]}<br><br>Resolve the daily question to restore system stability.</p></div><div style="text-align:center;padding:0 20px 18px"><button class="btn" onclick="closeWin('error${n}')">OK</button></div>`,420);el.style.left=(8+n*4)+'%';el.style.top=(8+n*5)+'%'}
function crash(){stopCascade();$('#crash').hidden=false;$('#crash').innerHTML=`<h2>A problem has been detected and DEADLINE XP has been shut down to prevent further damage.</h2><p>DAILY_QUESTION_NOT_RESOLVED</p><p>Seven containment attempts failed.<br>The simulation has reached a critical system failure.</p><p>Technical information:<br>*** STOP: 0x00000007 (0xDEAD11E, 0x00000000)</p><p>Case ${current().id} · ${practice?'Practice':'Daily'} session ended.<br>${practice?'You can restart practice to try again.':'Your daily attempt is complete. A new case is available tomorrow.'}</p><button onclick="recover()">Reboot desktop</button> <button onclick="reveal()">View case solution</button><p style="font-size:11px;opacity:.7">Staged game ending · Your device is safe.</p>`}
function reveal(){const p=document.createElement('p');p.textContent='Solution: '+current().options[current().correct]+'. '+current().explain;$('#crash').append(p)}
function recover(){stopCascade();$('#crash').hidden=true;[...windows.keys()].forEach(closeWin);stopCascade();desktop.classList.remove('infected','severe');toast('Recovery mode','Daily session ended. Open Help to start a practice case.');win('recovery','System Recovery',`<div class="setting"><h2>Desktop recovered</h2><p>The ${practice?'practice':'daily'} session ended after seven mistakes.</p><button class="btn" onclick="startPractice()">Start a practice session</button> <button class="btn" onclick="openApp('help')">Read me</button></div>`,470)}
function startPractice(){stopCascade();practice=true;installed=true;caseIndex=(caseIndex+1)%cases.length;state={wrong:0,solved:false,chosen:[]};[...windows.keys()].forEach(closeWin);$('#crash').hidden=true;$('#toast').hidden=true;effects();game()}
function logout(){paused=false;stopCascade();[...windows.keys()].forEach(closeWin);$('#toast').hidden=true;$('#startmenu').hidden=true;$('#login').hidden=false;desktop.classList.remove('infected','severe');$('#username').value=profile}
$('#loginform').onsubmit=e=>{e.preventDefault();profile=$('#username').value.trim();if(!profile)return;practice=false;state={wrong:0,solved:false,chosen:[]};installed=false;caseIndex=Math.floor(Date.parse(day+'T00:00:00Z')/86400000)%cases.length;try{const saved=JSON.parse(localStorage.getItem(key())||'null');if(saved){state={wrong:saved.wrong,solved:saved.solved,chosen:saved.chosen};caseIndex=saved.caseIndex;installed=saved.installed}}catch{}save();$('#login').hidden=true;effects();if(state.wrong>=7)recover();else if(installed)game();else welcome()};$('#username').value=localStorage.getItem('deadline-user')||'';
$('#start').onclick=()=>{const menu=$('#startmenu');menu.hidden=!menu.hidden;menu.innerHTML=`<div class="starthead"><span class="avatar" style="margin:0;width:48px;height:48px"><img src="assets/user.png" alt=""></span>${escapeHTML(profile)}</div><div class="startcols"><div><button onclick="openApp('game')"><img class="xp-icon" src="assets/icon-12.ico" alt=""> &nbsp; DEADLINE XP</button><button onclick="openApp('security')"><img class="xp-icon" src="assets/icon-48.ico" alt=""> &nbsp; Security Center</button><button onclick="openApp('help')"><img class="xp-icon" src="assets/icon-24.ico" alt=""> &nbsp; Read me</button></div><div><button onclick="openApp('files')"><img class="xp-icon" src="assets/folder.png" alt=""> &nbsp; My Documents</button><button onclick="openApp('computer')"><img class="xp-icon" src="assets/icon-16.ico" alt=""> &nbsp; My Computer</button><button onclick="openApp('settings')"><img class="xp-icon" src="assets/icon-36.ico" alt=""> &nbsp; Control Panel</button><div class="menu-sep"></div><button onclick="openApp('run')">Run...</button></div></div><div class="startfoot"><button onclick="logout()"><img class="xp-icon" src="assets/icon-48.ico" alt=""> Log Off</button><button onclick="shutdown()">⏻ Turn Off</button></div>`};
function shutdown(){$('#startmenu').hidden=true;win('shutdown','Turn off computer',`<div class="setting"><h2>End your session?</h2><p>Your daily progress is already saved on this browser.</p><button class="btn" onclick="logout()">Log off</button> <button class="btn" onclick="closeWin('shutdown')">Cancel</button></div>`,390)}
document.querySelectorAll('[data-open]').forEach(b=>{b.ondblclick=()=>openApp(b.dataset.open);b.onclick=e=>{if(e.detail===0)openApp(b.dataset.open)}});$('#audio').onclick=()=>{sound=!sound;$('#audio').textContent=sound?'♫':'♪';if(sound)beep('success')};function tick(){$('#clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}tick();setInterval(()=>tick(),10000);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#login').hidden&&$('#crash').hidden){if(windows.has('pause')){closeWin('pause');paused=false;syncCascade()}else{paused=true;stopCascade();win('pause','Game paused',`<div class="setting"><h2>Take a breath.</h2><p>This is a contained desktop simulation. Your device is safe.</p><button class="btn" onclick="paused=false;closeWin('pause');syncCascade()">Resume</button> <button class="btn" onclick="paused=false;logout()">Log off</button></div>`,410)}}});

function stopCascade(){clearTimeout(cascadeTimer);cascadeTimer=null;document.querySelectorAll('.corruption-trail').forEach(e=>e.remove())}
function syncCascade(){if(state.solved){stopCascade();return}clearTimeout(cascadeTimer);cascadeTimer=null;if(paused||!installed||state.solved||state.wrong<2||state.wrong>=7||!$('#login').hidden)return;cascadeTimer=setTimeout(cascadeStep,Math.max(1800,8000-state.wrong*950))}
function cascadeStep(){if(paused||state.solved||state.wrong>=7||!$('#login').hidden)return;const severity=state.wrong;let active=[...windows.keys()].filter(k=>k.startsWith('cascade'));if(active.length>=Math.min(18,3+severity*2))closeWin(active[0]);let n=++cascadeCount;let id='cascade'+n;const texts=[['Windows - Application Error','The application failed to initialize properly (0xc0000142). Click on OK to terminate the application.'],['Windows - Delayed Write Failed','Windows was unable to save all the data for the file C:\\WINDOWS\\system32\\config. The data has been lost.'],['Explorer.EXE','This program is not responding.'],['Windows File Protection','Files that are required for Windows to run properly have been replaced by unrecognized versions.'],['System Restore','Restoring system files...'],['Windows - Out of Virtual Memory','Your system is low on virtual memory. Windows is increasing the size of your virtual memory paging file.']];let [title,msg]=texts[n%texts.length];let el=win(id,title,`<div class="error-body"><span class="error-sign"></span><div><p>${msg}</p>${n%texts.length===4?'<div class="frozen-box"><i></i></div><p style="font-size:10px;margin-top:6px">Time remaining: Calculating...</p>':''}</div></div><div style="text-align:center;padding:0 10px 12px"><button class="btn" onclick="closeWin('${id}')">${n%texts.length===2?'End Now':'OK'}</button></div>`,330);const x=8+((n*191)%Math.max(50,innerWidth-370)),y=12+((n*113)%Math.max(50,innerHeight-240));el.style.left=x+'px';el.style.top=y+'px';el.style.zIndex=Math.max(5,z-12);beep();if(severity>=4){for(let j=0;j<severity-2;j++){let t=document.createElement('div');t.className='corruption-trail';t.textContent=title;t.style.left=Math.min(innerWidth-310,x+j*7)+'px';t.style.top=(y+25+j*20)+'px';desktop.append(t)}let trails=document.querySelectorAll('.corruption-trail');[...trails].slice(0,Math.max(0,trails.length-28)).forEach(e=>e.remove())}syncCascade()}
function runCommand(command){let c=command.trim().toLowerCase();closeWin('run');const apps={'deadline':'game','deadline.exe':'game','notepad':'note','explorer':'files','control':'settings','iexplore':'internet'};if(apps[c])openApp(apps[c]);else win('runerror','Run',`<div class="error-body"><span class="error-sign"></span><p>Windows cannot find '${escapeHTML(command)}'. Make sure you typed the name correctly, and then try again.</p></div><div class="wizard-footer"><button class="btn" onclick="closeWin('runerror')">OK</button></div>`,410)}
function showWindowMenu(e,id){document.querySelector('.context-menu')?.remove();let r=e.target.getBoundingClientRect();let m=document.createElement('div');m.className='context-menu';m.style.left=r.left+'px';m.style.top=r.bottom+'px';m.innerHTML=`<button onclick="windows.get('${id}').hidden=true;this.parentElement.remove()">Minimize</button><button onclick="closeWin('${id}');this.parentElement.remove()">Close &nbsp;&nbsp;&nbsp;&nbsp; Alt+F4</button>`;desktop.append(m)}
function openAboutLogin(){const old=$('.logbottom small');old.textContent='This is a browser game. Close this tab to turn off the simulation.'}
desktop.addEventListener('contextmenu',e=>{if(e.target!==desktop)return;e.preventDefault();document.querySelector('.context-menu')?.remove();let m=document.createElement('div');m.className='context-menu';m.style.left=Math.min(e.clientX,innerWidth-160)+'px';m.style.top=Math.min(e.clientY,innerHeight-140)+'px';m.innerHTML=`<button onclick="this.parentElement.remove()">Refresh</button><button onclick="openApp('files');this.parentElement.remove()">Explore</button><button onclick="openApp('settings');this.parentElement.remove()">Properties</button>`;desktop.append(m)});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.context-menu')&&!e.target.closest('[data-menu]'))document.querySelector('.context-menu')?.remove()});
</script><script src="case-data.js"></script><script src="investigation.js"></script><script src="first-step-guide.js"></script><script src="cash-story.js"></script><script src="outbreak.js"></script><script src="outbreak-variety.js"></script><script src="hospital-account.js"></script><script>
(function(){
  const params = new URLSearchParams(window.location.search);
  const autoMode = params.get('mode') || 'cash';
  const userParam = (params.get('user') || localStorage.getItem('deadline-user') || 'Dr. Player').trim() || 'Dr. Player';
  const uInput = document.getElementById('username');
  if (uInput) uInput.value = userParam;
  const cashRadio = document.getElementById('xpCashMode');
  const outbreakRadio = document.getElementById('xpOutbreakMode');
  const hospitalRadio = document.getElementById('xpHospitalMode');
  if (cashRadio) cashRadio.checked = (autoMode === 'cash');
  if (outbreakRadio) outbreakRadio.checked = (autoMode === 'outbreak');
  if (hospitalRadio) hospitalRadio.checked = (autoMode === 'hospital');
  document.querySelectorAll('input[name="gameMode"]').forEach(r => {
    r.checked = (r.value === autoMode);
  });
  const loginEl = document.getElementById('login');
  if (loginEl) loginEl.hidden = true;
  const form = document.getElementById('loginform');
  if (form && typeof form.onsubmit === 'function') {
    form.onsubmit(new Event('submit', { cancelable: true }));
  }
  logout = window.logout = function() {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'xp-embedded-logout' }, '*');
    }
  };
})();
</script></body></html>
